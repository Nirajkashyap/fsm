# Hand-written wrapper crate around buf-generated output (Cargo.toml/src/lib.rs
# are the only hand-written files in this directory — everything under
# pgfsm/ is generated by `buf generate`, see this package's README). Gives
# the generated Rust stubs a real crate boundary so consumers add a normal
# path dependency instead of `#[path]`-including a specific .rs file by a
# relative path computed by counting `../` back to this directory — see #106.
[package]
name = "pgfsm-proto-codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
