version: v2
managed:
  enabled: true
inputs:
  - directory: proto/fsm-core-async-op-worker
plugins:
  # TypeScript — protobuf-es (message types) + Connect (client/server RPC
  # stubs), both resolved from BSR. KNOWN BROKEN, kept only for parity with
  # the other three languages: BSR's connect-es plugin (both under bufbuild/
  # and connectrpc/) is stuck on old releases (v0.13, v1.6.1) built against
  # protobuf-es v1's output shape -- paired with the remote protobuf-es v2
  # message plugin (which `remote:` here resolves to, since no version is
  # pinned), the generated connect stub imports names (Empty, InvokeRequest,
  # ...) as values that the v2 message file only exports as types, which is a
  # real runtime failure (TS hides it -- type imports get erased -- but
  # Deno/Node crash on the unresolved import). Do not regenerate TypeScript
  # from this file -- use local.buf.gen.yaml instead. See README's
  # "TypeScript: why local, not remote plugins".
  - remote: buf.build/bufbuild/es
    out: gen/typescript
  - remote: buf.build/bufbuild/connect-es
    out: gen/typescript

  # Python — base message classes, .pyi type stubs, gRPC service stubs.
  - remote: buf.build/protocolbuffers/python
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi
    out: gen/python
  - remote: buf.build/grpc/python
    out: gen/python

  # Rust — prost (message types) + tonic (gRPC client/server stubs).
  - remote: buf.build/community/neoeinstein-prost
    out: gen/rust
  - remote: buf.build/community/neoeinstein-tonic
    out: gen/rust

  # Go — base message types + gRPC service stubs. `module=` (rather than
  # paths=source_relative) places output at a path derived from each file's
  # `go_package` option relative to that module prefix, so e.g.
  # activity-gateway.proto's go_package (.../gen/go/activitygateway) lands at
  # gen/go/activitygateway/ -- one directory per Go package, the idiomatic
  # layout, and what keeps working once a second .proto file/package is added.
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: module=github.com/pgfsm/fsm/packages/fsm-proto-codegen/gen/go
  - remote: buf.build/grpc/go
    out: gen/go
    opt: module=github.com/pgfsm/fsm/packages/fsm-proto-codegen/gen/go
